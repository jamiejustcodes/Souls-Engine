name: Foundation verification
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build with the installed MSVC toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'No x64 MSVC toolchain is installed on this runner.' }
          Import-Module (Join-Path $vsPath 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DSOULS_VULKAN_COMPILE_CHECK=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed.' }
          cmake --build build/ci --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - run: ctest --test-dir build/ci -C Debug -LE "gpu|interactive" --output-on-failure
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 clang-19 ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers xvfb
      - name: Configure
        run: |
          if [ '${{ matrix.compiler }}' = gcc ]; then export CC=gcc-14 CXX=g++-14; else export CC=clang-19 CXX=clang++-19; fi
          cmake --preset linux-sanitize
      - run: cmake --build --preset linux-sanitize --parallel 2
      - run: ctest --preset linux-sanitize -LE 'gpu|interactive'
      - name: Vulkan validation smoke on Mesa
        env:
          ASAN_OPTIONS: detect_leaks=0
          SDL_VIDEODRIVER: x11
        run: |
          xvfb-run -a ./build/linux-sanitize/SoulsRuntime --validation --smoke 120
          xvfb-run -a ./build/linux-sanitize/SoulsEditor --validation --smoke 120
          xvfb-run -a ./build/linux-sanitize/SoulsRuntime --playground --validation --smoke 120
          xvfb-run -a ./build/linux-sanitize/SoulsEditor --playground --validation --smoke 120
